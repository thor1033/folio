name: folio
description: A beautiful cross-platform document reader for PDF, PPTX, DOCX and more
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  bloc: ^9.2.0
  equatable: ^2.0.8
  file_picker: ^11.0.2
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.5.3

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
